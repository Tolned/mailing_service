{% extends "base.html" %}
{% block title %}Сообщения{% endblock %}
{% block content %}
<div class="card">
    <h2>Сообщения</h2>
    <a href="{% url 'mailings:message_create' %}" class="btn">+ Новое сообщение</a>
    <table>
        <thead><tr><th>Тема</th><th>Тело</th></tr></thead>
        <tbody>
            {% for msg in messages %}
                <tr>
                    <td>{{ msg.subject }}</td>
                    <td>{{ msg.body|truncatewords:20 }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="2">Сообщений пока нет.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
