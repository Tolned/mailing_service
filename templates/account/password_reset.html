<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #417690; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #417690; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Восстановление пароля</h2>
        <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit">Отправить ссылку</button>
        </form>
        <div class="links"><a href="{% url 'account_login' %}">Вернуться ко входу</a></div>
    </div>
</body>
</html>
