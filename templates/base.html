<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f4f9; color: #333; }
        .header { background: #417690; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; }
        .nav a:hover { text-decoration: underline; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 18px; background: #417690; color: white; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #305a6e; }
        .btn-danger { background: #d9534f; }
        .btn-danger:hover { background: #b53b37; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; font-weight: 600; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px 15px; margin-bottom: 10px; border-radius: 5px; }
        .messages .success { background: #dff0d8; color: #3c763d; }
        .messages .error { background: #f2dede; color: #a94442; }
        form .form-group { margin-bottom: 15px; }
        form label { display: block; margin-bottom: 5px; font-weight: 600; }
        form input[type="text"], form input[type="email"], form input[type="datetime-local"],
        form textarea, form select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .status-created { color: #777; }
        .status-started { color: #f0ad4e; font-weight: bold; }
        .status-finished { color: #5cb85c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Сервис рассылок</h1>
        <div class="nav">
            <a href="{% url 'core:home' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'mailings:client_list' %}">Клиенты</a>
                <a href="{% url 'mailings:message_list' %}">Сообщения</a>
                <a href="{% url 'mailings:mailing_list' %}">Рассылки</a>
                <a href="{% url 'mailings:stats' %}">Статистика</a>
                <a href="{% url 'account_logout' %}">Выйти ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'account_login' %}">Войти</a>
                <a href="{% url 'account_signup' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
