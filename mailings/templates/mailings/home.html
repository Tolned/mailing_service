<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис рассылок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #417690;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .nav a {
            margin-right: 15px;
            color: #417690;
            text-decoration: none;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        .content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #417690;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Сервис управления рассылками</h1>
    </div>

    <div class="nav">
        {% if user.is_authenticated %}
            <a href="{% url 'mailings:home' %}">Главная</a>
            <a href="{% url 'account_logout' %}">Выйти ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'account_login' %}">Войти</a>
            <a href="{% url 'account_signup' %}">Регистрация</a>
        {% endif %}
        <a href="{% url 'admin:index' %}">Админ-панель</a>
    </div>

    <div class="content">
        <h2>Добро пожаловать!</h2>
        <p>Это главная страница сервиса управления рассылками.</p>

        <div class="stats">
            <div class="stat-card">
                <h3>Всего рассылок</h3>
                <div class="number">0</div>
            </div>
            <div class="stat-card">
                <h3>Активных рассылок</h3>
                <div class="number">0</div>
            </div>
            <div class="stat-card">
                <h3>Уникальных получателей</h3>
                <div class="number">0</div>
            </div>
        </div>
    </div>
</body>
</html>
