[project]
name = "mailing-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Ges_1",email = "lond@nolano.ru"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=4.2)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-allauth (>=65.20.1,<66.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.eggs
        | \.git
        | \.hg |
       \.mypy_cache
       | \.tox
       | \.venv
       | dist
    )/
    | foo.py
                           
)
'''

[tool.isort]
line_length = 119

[tool.poetry]
package-mode = false  # ← ДОБАВЬ ЭТУ СТРОКУ
name = "mailing-service"
version = "0.1.0"
description = ""
authors = ["Your Name <your.email@example.com>"]